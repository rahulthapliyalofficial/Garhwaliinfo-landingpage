 and your contribution becomes part of the permanent archive."},{q:"Do you cover the whole of Uttarakhand?",a:"Our primary focus is the Garhwal region of Uttarakhand — from the Yamuna valley in the west to the Kali Ganga in the east, and from the Shivalik foothills to the high Himalayas. We occasionally cover culturally connected areas in the Kumaon region when they share significant cultural overlap."},{q:"What languages is the platform available in?",a:"Core content is available in Garhwali (in Devanagari and Roman script), Hindi, and English. As we grow, we plan to add more regional languages and dialects. Audio content is primarily in Garhwali with English and Hindi transcripts."},{q:"How does my subscription support Garhwal's culture?",a:"20% of all subscription revenue goes directly to our village documentation teams — local researchers, storytellers, and craftspeople who travel to remote villages to collect and verify content. The remaining revenue covers technology, editorial staff, and platform maintenance. We are committed to financial transparency."},{q:"Can schools or institutions use Garhwalinfo?",a:"Yes. Our Gurjar (Scholar) plan includes institutional access for up to 5 team members and is designed for schools, universities, cultural institutions, and research projects. We also offer custom institutional partnerships — reach out to us at hello@garhwalinfo.in for details."}];function x5(){const[a,l]=G.useState(null),o=G.useRef(null);return G.useEffect(()=>{const r=o.current;if(!r)return;const c=new IntersectionObserver(h=>{h.forEach(d=>{d.isIntersecting&&(d.target.classList.add("revealed"),c.unobserve(d.target))})},{threshold:.15});return r.querySelectorAll(".reveal").forEach(h=>c.observe(h)),()=>c.disconnect()},[]),m.jsxs("section",{ref:o,className:"relative section overflow-hidden","aria-labelledby":"faq-heading",children:[m.jsx("div",{className:"absolute inset-0 bg-gradient-to-b from-[#0d1c14] via-[#0f1e16] to-[#0d1c14] z-0"}),m.jsxs("div",{classNam
